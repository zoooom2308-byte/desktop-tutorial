plugins {
    id 'com.android.application'
}

android {
    namespace 'hr.najavaradova.app'
    compileSdk 34

    defaultConfig {
        applicationId 'hr.najavaradova.app'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            // Potpisivanje izdanja za Google Play: ključ i lozinke daje vlasnik preko varijabli okruženja (nikad u kodu).
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
