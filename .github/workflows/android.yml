name: Android aplikacija

on:
  push:
    branches: ['claude/**', main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ključ za potpisivanje (samo ako je vlasnik postavio tajne)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Izgradi testni APK i AAB za Google Play
        run: gradle -p android assembleDebug bundleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: najava-radova-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Objavi APK za preuzimanje (GitHub Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NajavaRadova.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest NajavaRadova.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Najava radova za Android (testna inačica)" \
            --notes "Testni APK za ručnu instalaciju (sideload). Potpisan je privremenim ključem, pa pri nadogradnji prvo deinstaliraj staru inačicu. Za Google Play potpisuje se vlastitim ključem, vidi notes/objava-u-trgovine.md."
